<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">My Gym Stats MCP architecture</title>
  <desc id="description">A four-component architecture diagram showing an LLM client, an MCP server, the Google Sheets API, and the workout logbook. Labeled arrows describe the messages exchanged between each component.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .component-title { fill: #0f172a; font-size: 24px; font-weight: 700; text-anchor: middle; }
      .component-detail { fill: #475569; font-size: 17px; font-weight: 500; text-anchor: middle; }
      .step { fill: #2563eb; font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-anchor: middle; }
      .message-primary { fill: #1e3a8a; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .message-secondary { fill: #475569; font-size: 16px; font-weight: 650; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="720" fill="#f8fafc"/>
  <circle cx="1475" cy="80" r="190" fill="#dbeafe" opacity="0.55"/>
  <circle cx="120" cy="690" r="220" fill="#e0e7ff" opacity="0.45"/>

  <text x="800" y="76" fill="#0f172a" font-size="38" font-weight="800" text-anchor="middle">My Gym Stats MCP</text>
  <text x="800" y="112" fill="#64748b" font-size="19" font-weight="500" text-anchor="middle">Architecture and message flow</text>

  <!-- Component 1: LLM client -->
  <g filter="url(#shadow)">
    <rect x="55" y="250" width="310" height="220" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="55" y="250" width="310" height="10" rx="5" fill="#2563eb"/>
  </g>
  <rect x="172" y="280" width="76" height="30" rx="15" fill="#dbeafe"/>
  <text class="step" x="210" y="300">STEP 1</text>
  <text class="component-title" x="210" y="354">LLM Client</text>
  <text class="component-detail" x="210" y="390">ChatGPT or another</text>
  <text class="component-detail" x="210" y="417">MCP-compatible host</text>

  <!-- Component 2: MCP server -->
  <g filter="url(#shadow)">
    <rect x="465" y="250" width="310" height="220" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="465" y="250" width="310" height="10" rx="5" fill="#4f46e5"/>
  </g>
  <rect x="582" y="280" width="76" height="30" rx="15" fill="#e0e7ff"/>
  <text class="step" x="620" y="300">STEP 2</text>
  <text class="component-title" x="620" y="354">MCP Server</text>
  <text class="component-detail" x="620" y="390">Node.js + TypeScript</text>
  <text class="component-detail" x="620" y="417">Tools and query handling</text>

  <!-- Component 3: Sheets API -->
  <g filter="url(#shadow)">
    <rect x="875" y="250" width="310" height="220" rx="18" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="875" y="250" width="310" height="10" rx="5" fill="#0f766e"/>
  </g>
  <rect x="992" y="280" width="76" height="30" rx="15" fill="#ccfbf1"/>
  <text class="step" x="1030" y="300">STEP 3</text>
  <text class="component-title" x="1030" y="354">Google Sheets API</text>
  <text class="component-detail" x="1030" y="390">HTTPS endpoint</text>
  <text class="component-detail" x="1030" y="417">Spreadsheet data access</text>

  <!-- Component 4: workout data -->
  <g filter="url(#shadow)">
    <rect x="1285" y="250" width="260" height="220" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="1285" y="250" width="260" height="10" rx="5" fill="#ea580c"/>
  </g>
  <rect x="1377" y="280" width="76" height="30" rx="15" fill="#ffedd5"/>
  <text class="step" x="1415" y="300">STEP 4</text>
  <text class="component-title" x="1415" y="354">Workout Logbook</text>
  <text class="component-detail" x="1415" y="390">Monthly spreadsheets</text>
  <text class="component-detail" x="1415" y="417">One tab per session</text>

  <!-- Client ⇄ MCP Server -->
  <line x1="365" y1="322" x2="465" y2="322" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="351" y="176" width="128" height="54" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="message-primary" x="415" y="198">MCP tool calls</text>
  <text class="message-primary" x="415" y="218">JSON-RPC</text>
  <path d="M415 230 L415 322" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="4 5"/>

  <line x1="465" y1="404" x2="365" y2="404" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <rect x="347" y="508" width="136" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="message-secondary" x="415" y="530">Tool results</text>
  <text class="message-secondary" x="415" y="550">JSON-RPC</text>
  <path d="M415 404 L415 508" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- MCP Server ⇄ Sheets API -->
  <line x1="775" y1="322" x2="875" y2="322" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="753" y="176" width="144" height="54" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="message-primary" x="825" y="198">Range requests</text>
  <text class="message-primary" x="825" y="218">HTTPS + JSON</text>
  <path d="M825 230 L825 322" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="4 5"/>

  <line x1="875" y1="404" x2="775" y2="404" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <rect x="743" y="508" width="164" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="message-secondary" x="825" y="530">Spreadsheet values</text>
  <text class="message-secondary" x="825" y="550">JSON</text>
  <path d="M825 404 L825 508" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Sheets API ⇄ workout logbook -->
  <line x1="1185" y1="322" x2="1285" y2="322" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="1180" y="176" width="110" height="54" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="message-primary" x="1235" y="198">Read ranges</text>
  <text class="message-primary" x="1235" y="218">API operation</text>
  <path d="M1235 230 L1235 322" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="4 5"/>

  <line x1="1285" y1="404" x2="1185" y2="404" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <rect x="1180" y="508" width="110" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="message-secondary" x="1235" y="530">Cell values</text>
  <text class="message-secondary" x="1235" y="550">Tabular data</text>
  <path d="M1235 404 L1235 508" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Flow legend -->
  <g transform="translate(566 638)">
    <line x1="0" y1="0" x2="62" y2="0" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="78" y="6" fill="#334155" font-size="15" font-weight="650">Request</text>
    <line x1="205" y1="0" x2="267" y2="0" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-slate)"/>
    <text x="283" y="6" fill="#334155" font-size="15" font-weight="650">Response</text>
  </g>
</svg>
